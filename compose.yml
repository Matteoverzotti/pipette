services:
  app:
    build:
      context: .
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Pipette - Feedback Cursuri UniBuc}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./runtime/logs/laravel:/var/www/html/storage/logs
      - ./runtime/logs/apache:/var/log/apache2
      - ./runtime/storage/app/public:/var/www/html/storage/app/public

  worker:
    build:
      context: .
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Pipette - Feedback Cursuri UniBuc}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "php artisan queue:work database --sleep=3 --tries=3 --timeout=90 --no-interaction
      >> /var/log/worker/worker.log 2>&1"
    volumes:
      - ./runtime/logs/laravel:/var/www/html/storage/logs
      - ./runtime/logs/worker:/var/log/worker
      - ./runtime/storage/app/public:/var/www/html/storage/app/public

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-unibuc_feedback}
      MYSQL_USER: ${MYSQL_USER:-ubfeedback}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
